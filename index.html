<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HPH · Stage 4 ITT · Countdown</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #fff;
  color: #000;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}

.header {
  background: #000;
  border-bottom: 3px solid #000;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}

.race-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #aaa;
  margin-bottom: 2px;
}

.header-title {
  font-weight: 800;
  font-size: 17px;
  letter-spacing: 0.3px;
  color: #fff;
  line-height: 1.2;
}

.header-sub {
  font-size: 11px;
  color: #666;
  letter-spacing: 0.3px;
  margin-top: 1px;
}

.live-clock {
  font-size: 32px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 3px;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

.col-headers {
  display: grid;
  grid-template-columns: 24px 1fr 80px 88px;
  padding: 6px 14px;
  border-bottom: 2px solid #000;
  background: #f2f2f2;
}

.col-hdr {
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #888;
  font-weight: 700;
}

.col-hdr:nth-child(3),
.col-hdr:nth-child(4) { text-align: right; }

.rider-list { padding-bottom: 60px; }

.rider-row {
  display: grid;
  grid-template-columns: 24px 1fr 80px 88px;
  align-items: center;
  padding: 11px 14px;
  border-bottom: 1px solid #e8e8e8;
  border-left: 4px solid transparent;
}

.rider-row.on-course {
  background: #f0f0f0;
  border-left-color: #000;
}

.rider-row.next-up {
  background: #f7f7f7;
  border-left-color: #999;
}

.rider-row.done {
  opacity: 0.3;
}

.pos-num {
  font-size: 11px;
  color: #bbb;
  font-weight: 700;
}

.rider-name {
  font-weight: 800;
  font-size: 17px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: #000;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 6px;
}

.rider-row.done .rider-name { color: #bbb; }

.start-time {
  font-size: 15px;
  font-weight: 600;
  color: #999;
  text-align: right;
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}

.rider-row.on-course .start-time { color: #333; }

.countdown-cell { text-align: right; }

.countdown-val {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
  color: #000;
}

.countdown-val.on-course {
  font-size: 12px;
  font-weight: 700;
  color: #000;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.countdown-val.done {
  font-size: 12px;
  font-weight: 600;
  color: #bbb;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}

.countdown-val.imminent {
  animation: blink 0.7s ease-in-out infinite;
}

.legend {
  display: flex;
  gap: 20px;
  padding: 10px 14px;
  border-top: 1px solid #e0e0e0;
  background: #f2f2f2;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #888;
  font-weight: 500;
  letter-spacing: 0.3px;
}

.legend-bar {
  width: 12px;
  height: 3px;
  border-radius: 1px;
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="race-label">Giro d'Italia Donne 2026 &middot; Stage 4 ITT</div>
    <div class="header-title">Human Powered Health</div>
    <div class="header-sub">Belluno &rarr; Piano Nevegal &middot; 12.73 km &middot; 718m</div>
  </div>
  <div class="live-clock" id="live-clock">--:--:--</div>
</div>

<div class="col-headers">
  <span class="col-hdr">#</span>
  <span class="col-hdr">Rider</span>
  <span class="col-hdr">Start</span>
  <span class="col-hdr">Countdown</span>
</div>

<div class="rider-list" id="rider-list"></div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-bar" style="background:#000"></div>On course
  </div>
  <div class="legend-item">
    <div class="legend-bar" style="background:#999"></div>Next up
  </div>
  <div class="legend-item">
    <div class="legend-bar" style="background:#ccc"></div>Complete
  </div>
</div>

<script>
var riders = [
  { name: "Marit Raaijmakers",   time: "13:26" },
  { name: "Thalita de Jong",     time: "13:44" },
  { name: "Maggie Coles-Lyster", time: "14:14" },
  { name: "Nina Buijsman",       time: "14:49" },
  { name: "Carlotta Cipressi",   time: "14:56" },
  { name: "Barbara Malcotti",    time: "15:28" },
  { name: "Lily Williams",       time: "15:55" },
];

var TT_DURATION_SECS = 30 * 60;

function parseTimeSecs(str) {
  var parts = str.split(':');
  return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60;
}

function nowSecs() {
  var n = new Date();
  return n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds();
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function formatCountdown(secs) {
  var abs = Math.abs(secs);
  var h = Math.floor(abs / 3600);
  var m = Math.floor((abs % 3600) / 60);
  var s = abs % 60;
  if (h > 0) return h + ':' + pad2(m) + ':' + pad2(s);
  return pad2(m) + ':' + pad2(s);
}

function render() {
  var now = nowSecs();
  var d = new Date();
  document.getElementById('live-clock').textContent =
    pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());

  var nextUpIdx = -1;
  for (var i = 0; i < riders.length; i++) {
    if (parseTimeSecs(riders[i].time) > now) { nextUpIdx = i; break; }
  }

  var html = '';
  for (var i = 0; i < riders.length; i++) {
    var r = riders[i];
    var st = parseTimeSecs(r.time);
    var diff = st - now;
    var onCourse = diff < 0 && diff > -TT_DURATION_SECS;
    var done = diff <= -TT_DURATION_SECS;
    var isNext = i === nextUpIdx;
    var imminent = diff >= 0 && diff <= 90;

    var rowClass = 'rider-row';
    if (onCourse) rowClass += ' on-course';
    else if (done) rowClass += ' done';
    else if (isNext) rowClass += ' next-up';

    var cdClass, cdText;
    if (done) {
      cdClass = 'done'; cdText = 'Finished';
    } else if (onCourse) {
      cdClass = 'on-course'; cdText = 'On course';
    } else if (imminent) {
      cdClass = 'imminent'; cdText = formatCountdown(diff);
    } else {
      cdClass = 'upcoming'; cdText = formatCountdown(diff);
    }

    html += '<div class="' + rowClass + '">';
    html += '<span class="pos-num">' + (i + 1) + '</span>';
    html += '<span class="rider-name">' + r.name.toUpperCase() + '</span>';
    html += '<span class="start-time">' + r.time + '</span>';
    html += '<div class="countdown-cell"><span class="countdown-val ' + cdClass + '">' + cdText + '</span></div>';
    html += '</div>';
  }

  document.getElementById('rider-list').innerHTML = html;
}

render();
setInterval(render, 1000);
</script>
</body>
</html>
