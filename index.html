<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HPH · Stage 4 ITT · Countdown</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
 
body {
  background: #000;
  color: #fff;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}
 
.header {
  background: linear-gradient(135deg, #7b2ff7 0%, #c0267e 45%, #e8481a 100%);
  padding: 14px 18px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
 
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
 
.hph-logo {
  width: 52px;
  height: 52px;
  object-fit: contain;
  filter: brightness(0) invert(1);
}
 
.header-text {}
 
.header-title {
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 0.3px;
  color: #fff;
  line-height: 1.1;
}
 
.header-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.7);
  letter-spacing: 0.5px;
  margin-top: 3px;
  text-transform: uppercase;
}
 
.live-clock {
  font-size: 34px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 3px;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
  text-shadow: 0 0 20px rgba(255,255,255,0.3);
}
 
.col-headers {
  display: grid;
  grid-template-columns: 32px 1fr 80px 100px;
  padding: 8px 16px;
  border-bottom: 1px solid #222;
  background: #0d0d0d;
}
 
.col-hdr {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #444;
  font-weight: 700;
}
 
.col-hdr:nth-child(3),
.col-hdr:nth-child(4) { text-align: right; }
 
.rider-list { padding-bottom: 60px; }
 
.rider-row {
  display: grid;
  grid-template-columns: 32px 1fr 80px 100px;
  align-items: center;
  padding: 13px 16px;
  border-bottom: 1px solid #111;
  border-left: 4px solid transparent;
  transition: background 0.4s;
}
 
.rider-row.on-course {
  background: #0d1f0f;
  border-left: 4px solid #00e676;
}
 
.rider-row.next-up {
  background: #1a1200;
  border-left: 4px solid #ffd600;
}
 
.rider-row.done {
  opacity: 0.25;
}
 
.pos-num {
  font-size: 12px;
  color: #333;
  font-weight: 700;
}
 
.rider-name {
  font-weight: 800;
  font-size: 19px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 6px;
}
 
.rider-row.next-up .rider-name { color: #ffd600; }
.rider-row.on-course .rider-name { color: #00e676; }
 
.start-time {
  font-size: 16px;
  font-weight: 600;
  color: #444;
  text-align: right;
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}
 
.rider-row.on-course .start-time { color: #1a6635; }
.rider-row.next-up .start-time { color: #6b5500; }
 
.countdown-cell { text-align: right; }
 
.countdown-val {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
  color: #fff;
}
 
.countdown-val.on-course {
  font-size: 13px;
  font-weight: 700;
  color: #00e676;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
 
.countdown-val.done {
  font-size: 12px;
  font-weight: 600;
  color: #333;
  letter-spacing: 1px;
  text-transform: uppercase;
}
 
.countdown-val.next-up {
  color: #ffd600;
}
 
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.15; }
}
 
.countdown-val.imminent {
  color: #ff4444;
  animation: blink 0.6s ease-in-out infinite;
}
 
.legend {
  display: flex;
  gap: 20px;
  padding: 10px 16px;
  border-top: 1px solid #1a1a1a;
  background: #060606;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
}
 
.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: #444;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
 
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
</style>
</head>

  <div class="legend-item"><div class="legend-dot" style="background:#00e676"></div>On course</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffd600"></div>Next up</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff4444"></div>Starting &lt;90s</div>
  <div class="legend-item"><div class="legend-dot" style="background:#333"></div>Finished</div>
</div>
 
<script>
var riders = [
  { name: "Marit Raaijmakers",   time: "13:26" },
  { name: "Thalita de Jong",     time: "13:44" },
  { name: "Maggie Coles-Lyster", time: "14:14" },
  { name: "Nina Buijsman",       time: "14:49" },
  { name: "Carlotta Cipressi",   time: "14:56" },
  { name: "Barbara Malcotti",    time: "15:28" },
  { name: "Lily Williams",       time: "15:55" },
];
 
var TT_DURATION_SECS = 39 * 60;
 
function parseTimeSecs(str) {
  var parts = str.split(':');
  return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60;
}
 
function nowSecs() {
  var n = new Date();
  return n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds();
}
 
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
 
function formatCountdown(secs) {
  var abs = Math.abs(secs);
  var h = Math.floor(abs / 3600);
  var m = Math.floor((abs % 3600) / 60);
  var s = abs % 60;
  if (h > 0) return h + ':' + pad2(m) + ':' + pad2(s);
  return pad2(m) + ':' + pad2(s);
}
 
function render() {
  var now = nowSecs();
  var d = new Date();
  document.getElementById('live-clock').textContent =
    pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
 
  var nextUpIdx = -1;
  for (var i = 0; i < riders.length; i++) {
    if (parseTimeSecs(riders[i].time) > now) { nextUpIdx = i; break; }
  }
 
  var html = '';
  for (var i = 0; i < riders.length; i++) {
    var r = riders[i];
    var st = parseTimeSecs(r.time);
    var diff = st - now;
    var onCourse = diff < 0 && diff > -TT_DURATION_SECS;
    var done = diff <= -TT_DURATION_SECS;
    var isNext = i === nextUpIdx;
    var imminent = diff >= 0 && diff <= 90;
 
    var rowClass = 'rider-row';
    if (onCourse) rowClass += ' on-course';
    else if (done) rowClass += ' done';
    else if (isNext) rowClass += ' next-up';
 
    var cdClass, cdText;
    if (done) {
      cdClass = 'done'; cdText = 'Finished';
    } else if (onCourse) {
      cdClass = 'on-course'; cdText = 'On course';
    } else if (imminent) {
      cdClass = 'imminent'; cdText = formatCountdown(diff);
    } else if (isNext) {
      cdClass = 'next-up'; cdText = formatCountdown(diff);
    } else {
      cdClass = 'upcoming'; cdText = formatCountdown(diff);
    }
 
    html += '<div class="' + rowClass + '">';
    html += '<span class="pos-num">' + (i + 1) + '</span>';
    html += '<span class="rider-name">' + r.name.toUpperCase() + '</span>';
    html += '<span class="start-time">' + r.time + '</span>';
    html += '<div class="countdown-cell"><span class="countdown-val ' + cdClass + '">' + cdText + '</span></div>';
    html += '</div>';
  }
 
  document.getElementById('rider-list').innerHTML = html;
}
 
render();
setInterval(render, 1000);
</script>
